name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-foundations-${{ matrix.os }}
          path: test-results/foundations/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-launch-${{ matrix.os }}
          path: test-results/browser-launch/
          if-no-files-found: ignore
      - run: pnpm release
      - run: npm ci --omit=dev
        working-directory: release/paperloop
      - run: node scripts/release/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: paperloop-0.1.0
          path: release/paperloop-0.1.0.tar.gz
